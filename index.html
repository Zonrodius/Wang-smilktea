<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="奶茶日记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f9f0e8">
<title>🧋 小宋给小王定制的奶茶日记</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #fffdf9;
    --surface: #f9f0e8;
    --surface2: #f2e4d4;
    --border: rgba(180,140,100,0.18);
    --border2: rgba(180,140,100,0.32);
    --text: #2c1f0e;
    --text2: #7a5c3a;
    --text3: #b08a62;
    --accent: #c0622a;
    --accent-light: #fce8dc;
    --accent-text: #8c3a12;
    --radius-sm: 10px;
    --radius: 14px;
    --radius-lg: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1108;
      --surface: #261a0c;
      --surface2: #33220f;
      --border: rgba(200,160,100,0.15);
      --border2: rgba(200,160,100,0.28);
      --text: #f5e8d0;
      --text2: #c49a6a;
      --text3: #8a6840;
      --accent: #e07840;
      --accent-light: #3a1f08;
      --accent-text: #f5b080;
    }
  }
  html, body { height: 100%; background: var(--bg); font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; color: var(--text); }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 80px; min-height: 100vh; }
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 52px 20px 18px; position: sticky; top: 0; z-index: 10; }
  .header-title { font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .header-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 14px 16px; background: var(--bg); border-bottom: 0.5px solid var(--border); }
  .stat { background: var(--surface); border-radius: var(--radius-sm); padding: 12px 10px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; margin-bottom: 5px; }
  .stat-value { font-size: 18px; font-weight: 600; color: var(--text); line-height: 1; }
  .stat-value.small { font-size: 13px; margin-top: 3px; }
  .form-wrap { padding: 14px 16px; border-bottom: 0.5px solid var(--border); }
  .form-card { background: var(--surface); border-radius: var(--radius-lg); padding: 16px; }
  .form-section-title { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; margin-bottom: 12px; font-weight: 500; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg.full { grid-column: 1/-1; }
  .fg label { font-size: 11px; color: var(--text3); letter-spacing: 0.03em; }
  .fg input, .fg select { height: 40px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 15px; padding: 0 12px; font-family: inherit; width: 100%; appearance: none; -webkit-appearance: none; outline: none; }
  .fg input:focus, .fg select:focus { border-color: var(--accent); }
  .fg input::placeholder { color: var(--text3); }
  .add-btn { margin-top: 12px; width: 100%; height: 44px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; font-family: inherit; cursor: pointer; letter-spacing: 0.04em; transition: opacity 0.15s, transform 0.1s; }
  .add-btn:active { opacity: 0.85; transform: scale(0.98); }
  .list-root { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .month-section { border-radius: var(--radius-lg); overflow: hidden; border: 0.5px solid var(--border); }
  .month-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: var(--surface); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .month-header-left { display: flex; align-items: center; gap: 10px; }
  .month-arrow { font-size: 10px; color: var(--text3); transition: transform 0.22s; display: inline-block; }
  .month-arrow.open { transform: rotate(90deg); }
  .month-label { font-size: 15px; font-weight: 600; color: var(--text); }
  .month-meta { font-size: 12px; color: var(--text3); }
  .month-total { font-size: 15px; font-weight: 600; color: var(--accent); }
  .month-body { background: var(--bg); }
  .month-body.collapsed { display: none; }
  .day-group { padding: 10px 14px 6px; }
  .day-label { font-size: 11px; color: var(--text3); letter-spacing: 0.04em; margin-bottom: 7px; padding-left: 2px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; border: 0.5px solid var(--border); }
  .item-emoji { font-size: 22px; flex-shrink: 0; width: 30px; text-align: center; line-height: 1; }
  .item-body { flex: 1; min-width: 0; }
  .item-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .item-brand { font-size: 11px; color: var(--text3); }
  .sugar-pill { font-size: 10px; background: var(--accent-light); color: var(--accent-text); padding: 1px 7px; border-radius: 8px; }
  .item-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .item-price { font-size: 14px; font-weight: 600; color: var(--text); min-width: 44px; text-align: right; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 4px; border-radius: 6px; line-height: 1; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; }
  .del-btn:active { background: var(--surface2); }
  .empty { text-align: center; padding: 50px 20px; color: var(--text3); font-size: 14px; line-height: 2; }
  .empty-emoji { font-size: 48px; display: block; margin-bottom: 10px; }
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    .app { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .header { padding-top: max(52px, calc(20px + env(safe-area-inset-top))); }
  }
  .install-tip { margin: 0 16px 0; padding: 10px 14px; background: var(--accent-light); border-radius: var(--radius-sm); border: 0.5px solid var(--border2); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .install-tip-text { font-size: 12px; color: var(--accent-text); flex: 1; line-height: 1.5; }
  .install-tip-close { font-size: 16px; color: var(--text3); padding: 2px 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title">🧋 小宋给小王定制的奶茶日记</div>
    <div class="header-sub" id="today-str"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">累计花费</div><div class="stat-value" id="s-total">¥0</div></div>
    <div class="stat"><div class="stat-label">喝了多少杯</div><div class="stat-value" id="s-cups">0 杯</div></div>
    <div class="stat"><div class="stat-label">最爱品牌</div><div class="stat-value small" id="s-fav">—</div></div>
  </div>
  <div id="install-wrap"></div>
  <div class="form-wrap">
    <div class="form-card">
      <div class="form-section-title">记录新的一杯</div>
      <div class="form-grid">
        <div class="fg full"><label>奶茶名称</label><input type="text" id="i-name" placeholder="珍珠奶茶、芋泥波波…" autocomplete="off" /></div>
        <div class="fg"><label>品牌 / 店家</label><input type="text" id="i-brand" placeholder="喜茶、一点点…" autocomplete="off" /></div>
        <div class="fg"><label>金额（元）</label><input type="number" id="i-price" placeholder="0.00" min="0" step="0.5" inputmode="decimal" /></div>
        <div class="fg"><label>甜度</label><select id="i-sugar"><option value="">不选</option><option value="无糖">无糖</option><option value="少糖">少糖</option><option value="半糖">半糖</option><option value="七分糖">七分糖</option><option value="全糖">全糖</option></select></div>
        <div class="fg"><label>日期</label><input type="date" id="i-date" /></div>
      </div>
      <button class="add-btn" onclick="addRecord()">＋ 记录这一杯</button>
    </div>
  </div>
  <div class="list-root" id="list-root"></div>
</div>
<script>
const KEY = 'milktea_v2';
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e) { return []; } }
function save(r) { localStorage.setItem(KEY, JSON.stringify(r)); }
function today() { return new Date().toISOString().slice(0,10); }
const d = new Date();
const days = ['日','一','二','三','四','五','六'];
document.getElementById('today-str').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+days[d.getDay()];
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isAndroid = /android/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if ((isIOS || isAndroid) && !isStandalone && !localStorage.getItem('tip_dismissed')) {
  const tip = document.getElementById('install-wrap');
  const msg = isIOS ? '📲 想添加到桌面？点击浏览器底部的「分享」→「添加到主屏幕」' : '📲 想添加到桌面？点击浏览器菜单「添加到主屏幕」';
  tip.innerHTML = `<div class="install-tip" style="margin-top:14px;"><div class="install-tip-text">${msg}</div><span class="install-tip-close" onclick="dismissTip()">✕</span></div>`;
}
function dismissTip() { localStorage.setItem('tip_dismissed','1'); document.getElementById('install-wrap').innerHTML = ''; }

function pickEmoji(name) {
  if (!name) return '🧋';
  if (/抹茶|绿茶|茉莉/.test(name)) return '🍵';
  if (/咖啡|拿铁|latte/i.test(name)) return '☕';
  if
